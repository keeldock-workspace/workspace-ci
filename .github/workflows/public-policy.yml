name: public-policy
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  policy:
    name: policy-${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CI_SHA: ${{ github.sha }}
    steps:
      - name: Run source-free policy checks
        uses: keeldock-platform/platform-ci/kit/bootstrap@55b1e26505ec9ab7348ccdb002f74f1b1b1c3162
        with:
          pool: workspace
