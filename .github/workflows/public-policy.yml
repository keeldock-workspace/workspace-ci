name: public-policy
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  policy:
    name: policy-${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CI_SHA: ${{ github.sha }}
    steps:
      - name: Run source-free policy checks
        uses: keeldock-platform/platform-ci/kit/bootstrap@c6b8d0258714b2b8bb37c6a8bf6838abe7e4a9df
        with:
          pool: workspace
